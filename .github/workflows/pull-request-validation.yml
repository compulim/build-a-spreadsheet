name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm clean-install

      - run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - run: npm run pretest

      - name: Run tests
        run: npm test

      - run: npm run posttest
