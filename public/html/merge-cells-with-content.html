<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser": "https://cdn.jsdelivr.net/npm/@onting/browser@0.1.1-main.202610280828.b09109b/static/index.js",
          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280824.1079aca/dist/index.js",
          "@onting/stub/": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280824.1079aca/dist/",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "expect": "https://esm.sh/expect?standalone",
          "worksheet": "../asset/js/worksheet.js"
        }
      }
    </script>
    <link href="../asset/css/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script type="module">
      import 'worksheet';
    </script>
    <worksheet-app id="spreadsheet"></worksheet-app>
    <script type="module">
      import { getStub } from '@onting/browser';
      import { createExpectMatcher } from '@onting/stub/expectMatcher.js';
      import { waitFor } from '@testduet/wait-for';
      import expect from 'expect';

      const stub = await getStub();

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      // WHEN: Focus on the A1 cell.
      await stub.EXPERIMENTAL_click(document.querySelector('.grid__cell-ref--a1'));

      // WHEN: Press ArrowDown, A, Tab, B, Tab, C, Enter.
      // The keystrokes are from https://www.w3.org/TR/webdriver1/#keyboard-actions.
      await stub.EXPERIMENTAL_type('\uE015a\tb\tc\uE007');

      // This is SHIFT (\uE008) + TAB (\t).
      // Use modifier \uF000 to hold a key, \uF001 to release a key.
      await stub.EXPERIMENTAL_type('\uF000\uE008\t\uF001\uE008');

      const { worksheet } = document.getElementById('spreadsheet');

      // WHEN: Merge cell B2..C3.
      worksheet.edit(edit => edit.mergeCells(1, 1, 2, 2));

      // THEN: Should match snapshot.
      await expect(stub.browsingContextCaptureScreenshot()).resolves.toMatchImageSnapshot();

      // THEN: Should merge content of C2 into B2.
      await waitFor(() => expect(document.querySelector('.grid__cell-ref--b2')).toHaveProperty('textContent', 'b c'));

      console.log('🆗');
    </script>
  </body>
</html>
