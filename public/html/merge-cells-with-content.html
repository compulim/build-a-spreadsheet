    <script type="importmap">

          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280411.5f580b2/dist/index.js",

  <body>
    <script type="module">
      import 'worksheet';
    </script>
    <compulim-worksheet id="spreadsheet"></compulim-worksheet>
    <script type="module">
      import { getStub } from '@onting/browser';
      import { createExpectMatcher } from '@onting/stub/expectMatcher.js';
      import expect from 'expect';

      const stub = await getStub();

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      await stub.EXPERIMENTAL_click(document.querySelectorAll('.grid__cell')[0]);

      // The keystrokes are from https://www.w3.org/TR/webdriver1/#keyboard-actions.
      // ArrowDown, A, Tab, B, Tab, C, Enter.
      await stub.EXPERIMENTAL_type('\uE015a\tb\tc\uE007');

      const { worksheet } = document.getElementById('spreadsheet');

      // Merge cell B2..C3.
      worksheet.edit(edit => edit.mergeCells(1, 1, 2, 2));
