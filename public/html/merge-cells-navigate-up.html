<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser": "https://cdn.jsdelivr.net/npm/@onting/browser@0.1.1-main.202610251852.46007c3/static/index.js",
          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280411.5f580b2/dist/index.js",
          "@onting/stub/": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280411.5f580b2/dist/",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "expect": "https://esm.sh/expect?standalone",
          "worksheet": "../asset/js/worksheet.js"
        }
      }
    </script>
    <link href="../asset/css/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script type="module">
      import 'worksheet';
    </script>
    <compulim-worksheet id="spreadsheet"></compulim-worksheet>
    <script type="module">
      import { getStub } from '@onting/browser';
      import { createExpectMatcher } from '@onting/stub/expectMatcher.js';
      import { waitFor } from '@testduet/wait-for';
      import expect from 'expect';

      const stub = await getStub();

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      const element = document.getElementById('spreadsheet');

      // GIVEN: Merge cell B2..C3.
      element.worksheet.edit(edit => edit.mergeCells(1, 1, 2, 2));

      // WHEN: Focus on the C4 cell.
      await stub.EXPERIMENTAL_click(document.querySelector('.grid__cell-ref--c4'));

      // WHEN: Press ArrowUp twice.
      // The keystrokes are from https://www.w3.org/TR/webdriver1/#keyboard-actions.
      await stub.EXPERIMENTAL_type('\uE013\uE013');

      // THEN: Should land on C1.
      await waitFor(() =>
        expect(element.selection).toEqual(
          expect.objectContaining({
            activeCell: { column: 2, row: 0 },
            range: { left: 2, top: 0, right: 2, bottom: 0 }
          })
        )
      );

      console.log('🆗');
    </script>
  </body>
</html>
