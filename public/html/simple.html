<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser": "https://cdn.jsdelivr.net/npm/@onting/browser@0.1.1-main.202610251852.46007c3/static/index.js",
          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610251830.dda9781/dist/index.js",
          "worksheet": "../asset/js/worksheet.js"
        }
      }
    </script>
    <link href="../asset/css/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script type="module">
      import 'worksheet';
    </script>
    <compulim-worksheet id="spreadsheet"></compulim-worksheet>
    <script type="module">
      import { getStub } from '@onting/browser';

      const stub = await getStub();

      await stub.EXPERIMENTAL_click(undefined, { x: 100, y: 40 });
      await stub.EXPERIMENTAL_type('\uE015a\tb\tc\uE007');

      const spreadsheetElement = document.getElementById('spreadsheet');

      console.log(spreadsheetElement);

      const { worksheet } = spreadsheetElement;

      worksheet.edit(edit => {
        edit.mergeCells(1, 1, 2, 2);
      });

      console.log('🆗');
    </script>
  </body>
</html>
